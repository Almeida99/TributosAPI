{% extends "base_modern.html" %}

{% block title %}Instalação do Schema{% endblock %}

{% block content %}
<div class="row mb-4 align-items-center">
    <div class="col">
        <h2 class="fw-bold m-0" style="font-family: 'Outfit';">Instalação do Schema</h2>
    </div>
    <div class="col-auto">
        <a href="{{ bp }}/integracoes?usr_cod={{ usr_cod }}" class="btn btn-secondary-glass">Voltar</a>
    </div>
</div>

<div class="glass-card p-4 shadow">
    {% if status == 'ok' %}
    <div class="alert alert-success">
        <i class="bi bi-check-circle me-2"></i>{{ message }}
    </div>
    {% elif status == 'erro' %}
    <div class="alert alert-danger">
        <i class="bi bi-exclamation-triangle me-2"></i>{{ message }}
    </div>
    {% else %}
    <div class="alert alert-warning">
        <i class="bi bi-exclamation-circle me-2"></i>{{ message }}
    </div>
    {% endif %}
    
    <a href="{{ bp }}/integracoes?usr_cod={{ usr_cod }}" class="btn btn-primary mt-3">Ir para Integrações</a>
</div>
{% endblock %}
