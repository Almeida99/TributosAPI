{% extends "base.html" %}
{% block content %}
  <div class="bg-white border rounded p-4">
    <h4 class="mb-3">Novo Token Gemini</h4>
    <form method="post" action="/tokens/novo?usr_cod={{ usr_cod }}">
      <div class="mb-3">
        <label class="form-label">API Key</label>
        <input class="form-control" name="api_key" required placeholder="Cole a chave do Gemini">
      </div>
      <div class="mb-3">
        <label class="form-label">Modelo</label>
        <input class="form-control" name="modelo" value="gemini-1.5-flash">
      </div>
      <div class="mb-3">
        <label class="form-label">Ativo</label>
        <select class="form-select" name="ativo">
          <option value="1" selected>Sim</option>
          <option value="0">Não</option>
        </select>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Salvar</button>
        <a class="btn btn-outline-secondary" href="/tokens?usr_cod={{ usr_cod }}">Cancelar</a>
      </div>
    </form>
  </div>
{% endblock %}
